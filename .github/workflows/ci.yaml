name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # This runs: format checks (via treefmt), clippy (via git-hooks)
  build-shell-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Configure sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv
      - name: Build the devenv shell and lint codebase
        run: devenv test
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Configure sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv
      - name: Build all crates
        run: devenv tasks run nosapi:build:release
  msrv-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.workspace-crates.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Generate MSRV crate matrix
        id: workspace-crates
        run: |
          matrix=$(python3 - <<'PY'
          import fnmatch
          import json
          import pathlib
          import tomllib

          workspace_root = pathlib.Path(".")
          workspace_manifest = workspace_root / "Cargo.toml"
          workspace = tomllib.loads(workspace_manifest.read_text())
          workspace_config = workspace["workspace"]
          members = workspace_config["members"]
          excludes = workspace_config.get("exclude", [])

          crates = []
          for member in members:
              matches = sorted(workspace_root.glob(member))
              member_paths = matches if matches else [workspace_root / member]

              for member_path in member_paths:
                  member_path = member_path.relative_to(workspace_root)
                  if any(fnmatch.fnmatchcase(member_path.as_posix(), exclude) for exclude in excludes):
                      continue

                  manifest = member_path / "Cargo.toml"
                  package = tomllib.loads(manifest.read_text())["package"]
                  crates.append({
                      "name": package["name"],
                      "manifest": manifest.as_posix(),
                  })

          crates = sorted(crates, key=lambda crate: crate["name"])
          print(json.dumps({"include": crates}, separators=(",", ":")))
          PY
          )
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  msrv:
    runs-on: ubuntu-latest
    needs: msrv-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.msrv-matrix.outputs.matrix) }}
    name: msrv (${{ matrix.name }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Configure sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv
      - name: Get current msrv
        id: data-msrv
        run: |
          current_msrv=$(devenv --quiet shell -- cargo msrv show --manifest-path "${{ matrix.manifest }}" --output-format minimal | tail -n 1);
          echo "current msrv: $current_msrv";
          echo "current=$current_msrv" >> "$GITHUB_OUTPUT";
      - name: Run cargo msrv
        run: devenv --quiet shell -- cargo msrv verify --manifest-path "${{ matrix.manifest }}" --min "${{ steps.data-msrv.outputs.current }}" --all-features
      - name: echo msrv info
        if: failure()
        run: |-
          echo "current msrv: ${{ steps.data-msrv.outputs.current }}";
          new_msrv=$(devenv --quiet shell -- cargo msrv show --manifest-path "${{ matrix.manifest }}" --output-format minimal | tail -n 1);
          echo "new msrv: $new_msrv";
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Configure sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv
      - name: Run unit tests
        run: devenv tasks run nosapi:test
