[package]
name = "nosapi_data"
version = "0.1.0"
description = "A library for unpacking and repacking NosTale's .NOS files"
keywords = ["nostale", "nosapi", "nos-files"]
categories = ["parsing", "parser-implementations"]
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/zakuciael/nosapi"
homepage = "https://github.com/zakuciael/nosapi"
documentation = "https://docs.rs/nosapi_data/"
edition.workspace = true
authors.workspace = true

[dependencies]
byteorder = "1.5.0"
derive_more = { version = "2.0.1", features = ["debug", "display"] }
encoding_rs = "0.8.35"
error-stack = "0.5.0"
lazy_static = "1.5.0"
regex = "1.11.1"
size = "0.5.0"
thiserror = "2.0.12"

[dev-dependencies]
rstest = "0.26.1"
similar-asserts = "1.7.0"
