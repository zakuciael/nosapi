[package]
name = "nosapi_blackbox"
version = "0.2.0"
description = "A library for generating/modifying Gameforge's blackbox string"
keywords = ["nostale", "nosapi", "gameforge", "blackbox", "fingerprint"]
categories = ["parser-implementations", "parsing"]
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/zakuciael/nosapi"
homepage = "https://github.com/zakuciael/nosapi"
documentation = "https://docs.rs/nosapi_blackbox/"
edition.workspace = true
authors.workspace = true

[dependencies]
base64 = "0.22.1"
bon = "3.9.3"
chrono = { version = "0.4.45", features = ["serde", "now"] }
rand = { version = "0.10.2", features = ["serde", "thread_rng"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_plain = "1.0.2"
serde_tuple_explicit = { version = "1.1.0" }
serde_with = { version = "3.21.0", features = ["base64"] }
percent-encoding = "2.3.2"
sha2 = "0.11.0"
hex = "0.4.3"
thiserror = "2.0.19"

[dev-dependencies]
rstest = "0.26.1"
